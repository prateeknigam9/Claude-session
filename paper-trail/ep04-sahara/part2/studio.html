<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Paper Trail kit</title>
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #fff; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; } #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="10" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<!-- engine: config, shared kit, this engine's drawing library -->
<script src="src/config.js"></script>
<script src="src/kit.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="src/cutout.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Anton&family=Special+Elite&family=Old+Standard+TT:wght@700&family=Oswald:wght@500;700&display=block" rel="stylesheet">
<script src="src/cast.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Permanent+Marker&family=UnifrakturMaguntia&display=block" rel="stylesheet">

<script src="src/trail4.js"></script>

</html>
